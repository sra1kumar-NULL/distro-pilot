[package]
name = "distropilot"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = "0.4"
zstd = { version = "0.13", features = ["legacy"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
dirs = "5"
walkdir = "2"
